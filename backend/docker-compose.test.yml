# Integration tests against a throwaway Postgres (data in tmpfs, nothing persisted).
#
#   All in Docker:  docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   Host tests:     docker compose -f docker-compose.test.yml up -d db-test
#                   DATABASE_URL=postgres://fixmycampus:fixmycampus@localhost:5433/fixmycampus_test npm test
#   Clean up:       docker compose -f docker-compose.test.yml down
name: fixmycampus-test
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fixmycampus
      POSTGRES_PASSWORD: fixmycampus
      POSTGRES_DB: fixmycampus_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmycampus -d fixmycampus_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: .
      target: test
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fixmycampus:fixmycampus@db-test:5432/fixmycampus_test
    command: ["npm", "test"]
