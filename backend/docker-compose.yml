# One-command start: `docker compose up --build` (from backend/). Copy .env.example to .env first.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixmycampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-fixmycampus}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default. Uncomment to connect with a local client:
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      UPLOADS_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-50}
      # libpq-style variables (read natively by `pg`), so passwords need no URL escaping.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-fixmycampus}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-fixmycampus}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
